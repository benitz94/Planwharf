name: Build desktop app

# Test build of the Electron installers, started by hand (Actions > Build desktop app > Run workflow).
# Released installers come from release.yml, attached to each vX.Y.Z release with the web app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: electron/dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: |
              electron/dist/*.AppImage
              electron/dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        working-directory: electron
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: electron
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: planwharf-desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
  draft:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/*/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "Planwharf desktop ${GITHUB_REF_NAME#desktop-}" --notes "Desktop app (Electron). The installers are not code-signed yet."
