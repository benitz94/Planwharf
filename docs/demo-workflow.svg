<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">How Planwharf works</title>
<desc id="desc">Five-step flow: choose a project, choose AI roles, approve a task, AI workers collaborate, inspect results and resume work.</desc>
<rect width="1100" height="340" rx="20" fill="#101827"/>
<text x="48" y="58" font-size="29" font-weight="700" font-family="Arial,sans-serif" fill="#f8fafc">One project. Multiple AIs. A clear record of the work.</text>
<text x="48" y="89" font-size="15" font-family="Arial,sans-serif" fill="#9cacc6">An illustrated workflow — not a screenshot of the application</text>
<g font-family="Arial,sans-serif">
<rect x="39" y="121" width="187" height="157" rx="13" fill="#1c2c41" stroke="#49617c"/>
<rect x="53" y="135" width="45" height="32" rx="9" fill="#2e567e"/><text x="75" y="157" text-anchor="middle" font-size="18" fill="white">1</text>
<text x="54" y="194" font-size="18" font-weight="700" fill="white">Choose a project</text>
<text x="54" y="220" font-size="14" fill="#c5d2e5">Keep its goal, files,</text><text x="54" y="241" font-size="14" fill="#c5d2e5">notes and history</text>
<text x="235" y="208" fill="#81baf4" font-size="23">→</text>
<rect x="258" y="121" width="187" height="157" rx="13" fill="#1c2c41" stroke="#49617c"/>
<rect x="272" y="135" width="45" height="32" rx="9" fill="#2e567e"/><text x="294" y="157" text-anchor="middle" font-size="18" fill="white">2</text>
<text x="273" y="194" font-size="18" font-weight="700" fill="white">Choose your AIs</text>
<text x="273" y="220" font-size="14" fill="#c5d2e5">Coordinate, code,</text><text x="273" y="241" font-size="14" fill="#c5d2e5">or review</text>
<text x="454" y="208" fill="#81baf4" font-size="23">→</text>
<rect x="477" y="121" width="187" height="157" rx="13" fill="#1c2c41" stroke="#49617c"/>
<rect x="491" y="135" width="45" height="32" rx="9" fill="#2e567e"/><text x="513" y="157" text-anchor="middle" font-size="18" fill="white">3</text>
<text x="492" y="194" font-size="18" font-weight="700" fill="white">Approve the plan</text>
<text x="492" y="220" font-size="14" fill="#c5d2e5">See tasks and</text><text x="492" y="241" font-size="14" fill="#c5d2e5">dependencies first</text>
<text x="673" y="208" fill="#81baf4" font-size="23">→</text>
<rect x="696" y="121" width="187" height="157" rx="13" fill="#1c2c41" stroke="#49617c"/>
<rect x="710" y="135" width="45" height="32" rx="9" fill="#2e567e"/><text x="732" y="157" text-anchor="middle" font-size="18" fill="white">4</text>
<text x="711" y="194" font-size="18" font-weight="700" fill="white">Watch AI work</text>
<text x="711" y="220" font-size="14" fill="#c5d2e5">Track workers and</text><text x="711" y="241" font-size="14" fill="#c5d2e5">actual outcomes</text>
<text x="892" y="208" fill="#81baf4" font-size="23">→</text>
<rect x="915" y="121" width="150" height="157" rx="13" fill="#1c2c41" stroke="#49617c"/>
<rect x="929" y="135" width="45" height="32" rx="9" fill="#2e567e"/><text x="951" y="157" text-anchor="middle" font-size="18" fill="white">5</text>
<text x="930" y="194" font-size="17" font-weight="700" fill="white">Review &amp;</text><text x="930" y="215" font-size="17" font-weight="700" fill="white">resume</text>
<text x="930" y="240" font-size="13" fill="#c5d2e5">Keep progress</text><text x="930" y="259" font-size="13" fill="#c5d2e5">and checkpoints</text>
</g>
<text x="48" y="316" font-size="14" font-family="Arial,sans-serif" fill="#a9b8cf">Planwharf coordinates work; your connected AI coding tools execute it.</text>
</svg>