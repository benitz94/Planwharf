<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit Calculator</title><style>body{font:20px system-ui;background:#102432;color:#fff;display:grid;place-items:center;min-height:95vh}main{max-width:360px;padding:24px}input{font:inherit;width:95%;padding:8px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}button{font:inherit;padding:14px}#status{min-height:2em;color:#ffd38a}</style><main><h1>Calculator</h1><label>Expression<input id="expression" autocomplete="off" inputmode="decimal"></label><p id="status" role="status"></p><div class="keys"></div><p>Keyboard: numbers and operators; Enter computes; Escape clears.</p></main><script src="calculator.js"></script><script>const input=document.querySelector('input'),status=document.querySelector('#status');function run(){try{input.value=Calculator.calculate(input.value);status.textContent='Result ready';}catch(e){status.textContent=e.message;}}function clear(){input.value='';status.textContent='';input.focus();}for(const key of ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','Clear']){const b=document.createElement('button');b.textContent=key;b.addEventListener('click',()=>{if(key==='=')run();else if(key==='Clear')clear();else{input.value+=key;input.focus();}});document.querySelector('.keys').append(b);}input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run();}if(e.key==='Escape'){e.preventDefault();clear();}});</script></html>
