<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Planwharf — Let the crew do it</title>
  <desc id="svg-desc">A dark, editorial diagram showing a user-approved goal, safe branch creation, AI lead planning, three parallel build agents with quota handoff, integration, verification, repeated work when needed, and a finished branch that the user can push.</desc>
  <defs>
    <clipPath id="rounded-canvas"><rect x="0" y="0" width="1200" height="800" rx="28"/></clipPath>
    <radialGradient id="green-aura" cx="62%" cy="42%" r="71%">
      <stop offset="0" stop-color="#5fcf98" stop-opacity=".23"/>
      <stop offset=".43" stop-color="#1f7a52" stop-opacity=".15"/>
      <stop offset="1" stop-color="#1f7a52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soft-seam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fcf98" stop-opacity=".4"/><stop offset="1" stop-color="#5fcf98" stop-opacity="0"/></linearGradient>
    <pattern id="micro-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 H 0 V 42" fill="none" stroke="#88bea0" stroke-width=".7" opacity=".07"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".66" numOctaves="3" seed="13" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <filter id="pill-shadow" x="-20%" y="-45%" width="140%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity=".38"/></filter>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7 Z" fill="#69bb90"/></marker>
    <marker id="amber-arrow" markerWidth="8" markerHeight="8" refX="6.7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7 Z" fill="#e8b455"/></marker>
    <marker id="violet-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#b9a6ff"/></marker>
    <style type="text/css"><![CDATA[
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .eyebrow { fill:#a3c4b0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:14px; font-weight:700; letter-spacing:2.7px; }
      .hero-title { fill:#f6f7f3; font-family:Georgia, "Times New Roman", serif; font-size:51px; font-weight:400; letter-spacing:-1.4px; }
      .hero-sub { fill:#a9b7ae; font-size:17px; font-weight:400; }
      .node-body { fill:#171c1a; stroke:#35433b; stroke-width:1.25; filter:url(#pill-shadow); }
      .node-heading { fill:#f7f8f5; font-size:17px; font-weight:700; letter-spacing:.05px; }
      .node-caption { fill:#9aa69f; font-size:13.5px; font-weight:400; }
      .node-heading-small { fill:#f7f8f5; font-size:16px; font-weight:700; }
      .node-caption-small { fill:#9aa69f; font-size:12.8px; }
      .main-path { fill:none; stroke:#74c39c; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.85; }
      .main-arrow { fill:none; stroke:#74c39c; stroke-width:2; stroke-linecap:round; marker-end:url(#green-arrow); }
      .secondary-amber { fill:none; stroke:#e8b455; stroke-width:2.2; stroke-dasharray:5 6; stroke-linecap:round; stroke-linejoin:round; }
      .secondary-violet { fill:none; stroke:#b9a6ff; stroke-width:2; stroke-dasharray:5 7; stroke-linejoin:round; marker-end:url(#violet-arrow); }
      .chip-bg { fill:#222a25; stroke:#3f5246; stroke-width:1; }
      .chip-amber { fill:#2a2720; stroke:#675437; stroke-width:1; }
      .chip-violet { fill:#25222f; stroke:#55476e; stroke-width:1; }
      .chip-text { fill:#d7e4dc; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; font-weight:700; letter-spacing:.65px; }
      .chip-text-amber { fill:#f2ddb3; }
      .chip-text-violet { fill:#d6c9ff; }
      .icon-stroke { fill:none; stroke:#ffffff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    ]]></style>
  </defs>

  <g clip-path="url(#rounded-canvas)">
    <rect width="1200" height="800" fill="#0f1513"/>
    <ellipse cx="810" cy="361" rx="645" ry="545" fill="url(#green-aura)"/>
    <rect width="1200" height="800" fill="url(#micro-grid)"/>
    <rect width="1200" height="800" filter="url(#grain)" opacity=".048"/>
    <path d="M 55 347 H 306" fill="none" stroke="url(#soft-seam)" stroke-width="1.5"/>
    <path d="M 365 62 V 738" fill="none" stroke="#7ca38d" stroke-opacity=".085" stroke-width="1"/>
  </g>
  <rect x="1" y="1" width="1198" height="798" rx="27" fill="none" stroke="#34453b" stroke-width="1.25"/>

  <!-- Editorial introduction -->
  <rect x="66" y="66" width="9" height="9" fill="#5fcf98"/>
  <text x="89" y="75" class="eyebrow">HOW THE CREW WORKS</text>
  <text x="65" y="151" class="hero-title">Let the crew</text>
  <text x="65" y="206" class="hero-title">do it</text>
  <text x="66" y="266" class="hero-sub">One goal in, finished work out.</text>
  <text x="66" y="295" class="hero-sub">You watch, and step in when it asks.</text>

  <!-- Primary workflow connectors: deliberately behind cards and chips -->
  <path class="main-arrow" d="M764 124 V165"/>
  <path class="main-path" d="M764 234 V257 M507 257 H1015"/>
  <path class="main-arrow" d="M507 257 V289"/>
  <path class="main-arrow" d="M764 257 V289"/>
  <path class="main-arrow" d="M1015 257 V289"/>
  <circle cx="507" cy="257" r="3" fill="#75c39a"/>
  <circle cx="764" cy="257" r="3" fill="#75c39a"/>
  <circle cx="1015" cy="257" r="3" fill="#75c39a"/>
  <path class="main-path" d="M507 366 V430 H764 M764 366 V430 M1015 366 V430 H764"/>
  <path class="main-arrow" d="M764 430 V463"/>
  <path class="main-arrow" d="M764 524 V577"/>
  <path class="main-arrow" d="M764 644 V707"/>

  <!-- The amber quota handoff is a secondary cross-worker link -->
  <path d="M879 327 H899" class="secondary-amber" marker-end="url(#amber-arrow)"/>
  <path d="M890 336 V378" class="secondary-amber"/>

  <!-- Violet return path stays outside the working nodes -->
  <path d="M596 608 H373 V199 H596" class="secondary-violet"/>
  <path d="M373 509 H387" fill="none" stroke="#b9a6ff" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- 1: User action -->
  <g>
    <rect x="596" y="56" width="336" height="68" rx="34" class="node-body"/>
    <circle cx="631" cy="90" r="21" fill="#1f7a52"/>
    <path d="M627 82 L640 90 L627 98 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="667" y="84" class="node-heading">Let the crew do it</text>
    <text x="667" y="106" class="node-caption">you approve the goal</text>
  </g>

  <!-- New branch chip -->
  <g>
    <rect x="696" y="134" width="136" height="26" rx="13" class="chip-bg"/>
    <circle cx="712" cy="147" r="4" fill="#5fcf98"/>
    <text x="725" y="151.5" class="chip-text">NEW BRANCH</text>
  </g>

  <!-- 2: Lead -->
  <g>
    <rect x="596" y="166" width="336" height="68" rx="34" class="node-body"/>
    <circle cx="631" cy="200" r="21" fill="#6d4fd8"/>
    <path d="M631 187 L634 197 L644 200 L634 203 L631 213 L628 203 L618 200 L628 197 Z" fill="none" stroke="#fff" stroke-width="1.75" stroke-linejoin="round"/>
    <circle cx="642" cy="189" r="1.8" fill="#fff"/>
    <text x="667" y="194" class="node-heading">Lead</text>
    <text x="667" y="216" class="node-caption">plans and splits the work</text>
  </g>

  <!-- 3: Parallel builders -->
  <g>
    <rect x="391" y="290" width="233" height="76" rx="38" class="node-body"/>
    <circle cx="426" cy="328" r="20" fill="#2563c9"/>
    <path d="M422 322 L416 328 L422 334 M430 322 L436 328 L430 334 M428 319 L424 337" class="icon-stroke"/>
    <text x="453" y="320" class="node-heading-small">Part 1 · Build</text>
    <text x="453" y="344" class="node-caption-small">light model · src/ui</text>
  </g>
  <g>
    <rect x="645" y="290" width="234" height="76" rx="38" class="node-body"/>
    <circle cx="680" cy="328" r="20" fill="#2563c9"/>
    <path d="M676 322 L670 328 L676 334 M684 322 L690 328 L684 334 M682 319 L678 337" class="icon-stroke"/>
    <text x="707" y="320" class="node-heading-small">Part 2 · Build</text>
    <text x="707" y="344" class="node-caption-small">strong model · engine</text>
  </g>
  <g>
    <rect x="899" y="290" width="233" height="76" rx="38" class="node-body"/>
    <circle cx="934" cy="328" r="20" fill="#2563c9"/>
    <path d="M930 322 L924 328 L930 334 M938 322 L944 328 L938 334 M936 319 L932 337" class="icon-stroke"/>
    <text x="961" y="320" class="node-heading-small">Part 3 · Build</text>
    <text x="961" y="344" class="node-caption-small">another model · tests</text>
  </g>

  <!-- Quota handoff chip -->
  <g>
    <rect x="805" y="378" width="205" height="30" rx="15" class="chip-amber"/>
    <circle cx="822" cy="393" r="4" fill="#e8b455"/>
    <text x="835" y="397.5" class="chip-text chip-text-amber">QUOTA LOW · HANDOFF</text>
  </g>

  <!-- 4: Integration -->
  <g>
    <rect x="596" y="463" width="336" height="61" rx="30.5" class="node-body"/>
    <circle cx="631" cy="493.5" r="20" fill="#1f7a52"/>
    <path d="M623 482 V488 Q623 493 630 493 H640 M623 505 V499 Q623 494 630 494 H640 M635 489 L641 494 L635 499" class="icon-stroke"/>
    <text x="667" y="488" class="node-heading">Integration</text>
    <text x="667" y="509" class="node-caption">joins the parts</text>
  </g>

  <!-- NOT DONE loops from Verify back to Lead -->
  <g>
    <rect x="386" y="494" width="181" height="30" rx="15" class="chip-violet"/>
    <circle cx="402" cy="509" r="4" fill="#b9a6ff"/>
    <text x="415" y="513.5" class="chip-text chip-text-violet">NOT DONE · NEXT</text>
  </g>

  <!-- Testing connector -->
  <g>
    <rect x="694" y="536" width="140" height="27" rx="13.5" class="chip-bg"/>
    <circle cx="710" cy="549.5" r="4" fill="#5fcf98"/>
    <text x="723" y="554" class="chip-text">TEST RESULT</text>
  </g>

  <!-- 5: Verify -->
  <g>
    <rect x="596" y="577" width="336" height="67" rx="33.5" class="node-body"/>
    <circle cx="631" cy="610.5" r="21" fill="#c2600f"/>
    <path d="M631 598 L642 602 V609 Q642 618 631 623 Q620 618 620 609 V602 Z" class="icon-stroke"/>
    <path d="M625 610 L629 614 L636 606" class="icon-stroke"/>
    <text x="667" y="604" class="node-heading">Verify</text>
    <text x="667" y="626" class="node-caption">runs the tests, fixes what fails</text>
  </g>

  <!-- Side note: things the user must resolve -->
  <path d="M932 611 H947" class="secondary-amber"/>
  <g>
    <rect x="947" y="595" width="218" height="31" rx="15.5" class="chip-amber"/>
    <circle cx="964" cy="610.5" r="4" fill="#e8b455"/>
    <text x="977" y="615" class="chip-text chip-text-amber">NEEDS YOUR DECISION</text>
  </g>

  <!-- Reached-goal connector -->
  <g>
    <rect x="686" y="660" width="156" height="27" rx="13.5" class="chip-bg"/>
    <circle cx="702" cy="673.5" r="4" fill="#5fcf98"/>
    <text x="715" y="678" class="chip-text">GOAL REACHED</text>
  </g>

  <!-- 6: Finished, never push to main -->
  <g>
    <rect x="596" y="707" width="336" height="66" rx="33" class="node-body"/>
    <circle cx="631" cy="740" r="21" fill="#1f7a52"/>
    <path d="M622 740 L628 746 L641 733" class="icon-stroke" stroke-width="2.7"/>
    <text x="667" y="734" class="node-heading">Work finished</text>
    <text x="667" y="756" class="node-caption">you push it · never to main</text>
  </g>
</svg>
